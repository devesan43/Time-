<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="amberPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle for Android -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle tech ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#334155" stroke-width="6" stroke-dasharray="8 12" opacity="0.4"/>
  
  <!-- Screen time ring 1: Social Media (Pink/Purple) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#e879f9" stroke-width="18" stroke-linecap="round" stroke-dasharray="720 1000" transform="rotate(-90 256 256)" opacity="0.9" filter="url(#glow)"/>
  
  <!-- Screen time ring 2: Browsing & Productivity (Cyan/Blue) -->
  <circle cx="256" cy="256" r="125" fill="none" stroke="#38bdf8" stroke-width="16" stroke-linecap="round" stroke-dasharray="520 800" transform="rotate(45 256 256)" opacity="0.95"/>
  
  <!-- Screen time ring 3: Other / Alerts (Amber) -->
  <circle cx="256" cy="256" r="92" fill="none" stroke="#fbbf24" stroke-width="14" stroke-linecap="round" stroke-dasharray="320 600" transform="rotate(160 256 256)" opacity="0.9"/>

  <!-- Phone / Screen Core -->
  <rect x="206" y="196" width="100" height="120" rx="18" fill="#1e293b" stroke="url(#cyanPurple)" stroke-width="6"/>
  
  <!-- Hourglass / Screen pulse symbol in center -->
  <circle cx="256" cy="242" r="14" fill="#38bdf8"/>
  <rect x="236" y="270" width="40" height="6" rx="3" fill="#94a3b8"/>
  <rect x="244" y="284" width="24" height="4" rx="2" fill="#64748b"/>
</svg>
